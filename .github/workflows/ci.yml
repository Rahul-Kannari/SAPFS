name: SAPFS CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sapfs_user
          POSTGRES_PASSWORD: sapfs_pass
          POSTGRES_DB: sapfs_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://sapfs_user:sapfs_pass@localhost:5432/sapfs_test
          JWT_SECRET_KEY: test-secret-key
          SECRET_KEY: test-secret-key
        run: |
          cd backend
          pytest tests/ -v --tb=short --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with: { file: backend/coverage.xml }

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'frontend/package-lock.json' }
      - name: Install and build
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with: { name: frontend-build, path: frontend/build/ }

  docker-build:
    name: Docker Build Test
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -f deployment/docker/Dockerfile.backend -t sapfs-backend:ci backend/
      - name: Build frontend Docker image
        run: docker build -f deployment/docker/Dockerfile.frontend -t sapfs-frontend:ci frontend/
      - name: Security scan
        uses: aquasecurity/trivy-action@master
        with: { image-ref: 'sapfs-backend:ci', format: 'table', exit-code: '0' }

  deploy-staging:
    name: Deploy to Staging
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging
        run: echo "Deploying to staging server..."
