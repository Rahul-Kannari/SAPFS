version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: sapfs_db
    environment:
      POSTGRES_DB: sapfs_db
      POSTGRES_USER: sapfs_user
      POSTGRES_PASSWORD: sapfs_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ../../database/seeds:/docker-entrypoint-initdb.d/seeds:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapfs_user -d sapfs_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sapfs_network]
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sapfs_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    networks: [sapfs_network]
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ../../backend
      dockerfile: ../deployment/docker/Dockerfile.backend
    container_name: sapfs_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://sapfs_user:sapfs_pass@db:5432/sapfs_db
      DATABASE_SYNC_URL: postgresql://sapfs_user:sapfs_pass@db:5432/sapfs_db
      REDIS_URL: redis://redis:6379
      SECRET_KEY: your-super-secret-key-change-in-production
      JWT_SECRET_KEY: your-jwt-secret-key-change-in-production
      DEBUG: "false"
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:80"]'
    ports:
      - "8000:8000"
    volumes:
      - ../../ml_training/models:/app/ml_models:ro
      - uploads_data:/app/uploads
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [sapfs_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deployment/docker/Dockerfile.frontend
    container_name: sapfs_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks: [sapfs_network]
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sapfs_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks: [sapfs_network]
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:

networks:
  sapfs_network:
    driver: bridge
